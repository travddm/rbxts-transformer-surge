name: CI

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]

jobs:
    ci:
        name: Lint + Format + Spell Check + Compile + Test
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Cache npm dependencies
              uses: actions/cache@v6
              with:
                  path: node_modules
                  key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
                  restore-keys: |
                      ${{ runner.os }}-node-modules-

            - name: Set up mise
              uses: jdx/mise-action@v4
              with:
                  install: true
                  cache: true

            - name: "Check: Lint"
              run: mise run lint:check

            - name: "Check: Format"
              run: mise run format:check

            - name: "Check: Spell"
              run: mise run spell

            - name: "Check: Compile"
              run: mise run compile

            - name: "Test: Jest"
              run: mise run test
